name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy scipy pandas scikit-learn matplotlib openpyxl pillow flask pytest
      - run: python src/modelling/gen_dataset.py > /dev/null && python src/modelling/build_pod_rom.py | tail -1
      - run: pytest -q tests
